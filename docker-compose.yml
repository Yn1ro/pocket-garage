services:

  postgres:
    image: postgres:16
    container_name: karmannyi-garazh-postgres

    environment:
      POSTGRES_DB: karmannyi_garazh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
